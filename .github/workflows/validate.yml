# HACS's and Home Assistant's own checks on the integration, each time a new version of it arrives
name: Validate

on:
  push:
    branches: [main]
    paths: ['custom_components/**']
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # HACS asks for an open source license only to list a repository in its default store, not to install from one
          ignore: license
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
